<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>思维导图 - 在线编辑器</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link rel="stylesheet" href="static/css/mindmap.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <input type="text" class="title-input" placeholder="输入思维导图标题..." value="新建思维导图">
            <div class="header-actions">
                <button class="btn btn-secondary" id="btnAI">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2z"/>
                        <path d="M12 6v6l4 2"/>
                    </svg>
                    AI助手
                </button>
                <button class="btn btn-primary" id="btnSave">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    保存
                </button>
            </div>
        </header>

        <main>
            <div id="mindmap-container"></div>
            <div class="toolbar">
                <button class="btn btn-sm btn-secondary" id="btnAddChild">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    添加子节点
                </button>
                <button class="btn btn-sm btn-secondary" id="btnEdit">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                    </svg>
                    编辑节点
                </button>
                <button class="btn btn-sm btn-danger" id="btnDelete">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"/>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        <line x1="10" y1="11" x2="10" y2="17"/>
                        <line x1="14" y1="11" x2="14" y2="17"/>
                    </svg>
                    删除节点
                </button>
                <select id="nodeStyle" class="btn btn-sm btn-secondary">
                    <option value="rectangle">矩形节点</option>
                    <option value="ellipse">椭圆节点</option>
                    <option value="cloud">云形节点</option>
                </select>
                <input type="color" id="nodeColor" value="#2196F3" title="节点颜色">
            </div>
            <div class="zoom-controls">
                <button class="zoom-btn" id="btnZoomIn">+</button>
                <button class="zoom-btn" id="btnZoomOut">-</button>
                <button class="zoom-btn" id="btnZoomFit">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
                    </svg>
                </button>
            </div>
        </main>
    </div>

    <script>
        // 初始化思维导图数据
        const initialData = {
            id: 'root',
            text: '中心主题',
            children: []
        };

        // 保存思维导图数据到localStorage
        function saveToLocalStorage() {
            const title = document.querySelector('.title-input').value;
            const data = {
                title,
                mindmap: mindmapData
            };
            localStorage.setItem('mindmap', JSON.stringify(data));
        }

        // 从localStorage加载思维导图数据
        function loadFromLocalStorage() {
            const saved = localStorage.getItem('mindmap');
            if (saved) {
                const data = JSON.parse(saved);
                document.querySelector('.title-input').value = data.title;
                return data.mindmap;
            }
            return initialData;
        }

        // 初始化D3.js
        const width = document.getElementById('mindmap-container').clientWidth;
        const height = document.getElementById('mindmap-container').clientHeight;
        const svg = d3.select('#mindmap-container')
            .append('svg')
            .attr('width', width)
            .attr('height', height);

        // 创建缩放行为
        const zoom = d3.zoom()
            .scaleExtent([0.1, 4])
            .on('zoom', (event) => {
                g.attr('transform', event.transform);
            });

        svg.call(zoom);
        const g = svg.append('g');

        // 创建树形布局
        const tree = d3.tree()
            .size([height, width - 200])
            .separation((a, b) => (a.parent === b.parent ? 1 : 2));

        // 加载数据
        let mindmapData = loadFromLocalStorage();
        update(mindmapData);

        // 更新视图函数
        function update(source) {
            const root = d3.hierarchy(source);
            const nodes = root.descendants();
            const links = root.links();

            // 计算节点位置
            tree(root);

            // 更新连接线
            const link = g.selectAll('.link')
                .data(links, d => d.target.data.id);

            link.enter()
                .append('path')
                .attr('class', 'link')
                .attr('d', d3.linkHorizontal()
                    .x(d => d.y)
                    .y(d => d.x));

            // 更新节点
            const node = g.selectAll('.node')
                .data(nodes, d => d.data.id);

            const nodeEnter = node.enter()
                .append('g')
                .attr('class', 'node')
                .attr('transform', d => `translate(${d.y},${d.x})`);

            // 添加节点矩形
            nodeEnter.append('rect')
                .attr('width', 120)
                .attr('height', 40)
                .attr('x', -60)
                .attr('y', -20);

            // 添加节点文本
            nodeEnter.append('text')
                .text(d => d.data.text)
                .attr('dy', '0.3em');

            // 事件处理
            document.getElementById('btnSave').onclick = saveToLocalStorage;
            document.getElementById('btnAddChild').onclick = () => {
                // 添加子节点逻辑
            };
            document.getElementById('btnEdit').onclick = () => {
                // 编辑节点逻辑
            };
            document.getElementById('btnDelete').onclick = () => {
                // 删除节点逻辑
            };
            document.getElementById('btnZoomIn').onclick = () => {
                svg.transition().call(zoom.scaleBy, 1.2);
            };
            document.getElementById('btnZoomOut').onclick = () => {
                svg.transition().call(zoom.scaleBy, 0.8);
            };
            document.getElementById('btnZoomFit').onclick = () => {
                const bounds = g.node().getBBox();
                const parent = g.node().parentElement;
                const fullWidth = parent.clientWidth;
                const fullHeight = parent.clientHeight;
                const width = bounds.width;
                const height = bounds.height;
                const midX = bounds.x + width / 2;
                const midY = bounds.y + height / 2;
                const scale = 0.8 / Math.max(width / fullWidth, height / fullHeight);
                const translate = [fullWidth / 2 - scale * midX, fullHeight / 2 - scale * midY];

                svg.transition()
                    .duration(750)
                    .call(zoom.transform, d3.zoomIdentity
                        .translate(translate[0], translate[1])
                        .scale(scale));
            };
        }

        // 自适应窗口大小
        window.addEventListener('resize', () => {
            const container = document.getElementById('mindmap-container');
            svg.attr('width', container.clientWidth)
               .attr('height', container.clientHeight);
            tree.size([container.clientHeight, container.clientWidth - 200]);
            update(mindmapData);
        });
    </script>
</body>
</html>
